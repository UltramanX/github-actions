name: workflow-syntax
on:
  push:
    branches: 
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

env:
  ENV_TYPE: DEV
  APP_USER: UltramanX
  APP_PORT: 80
  
jobs:
  job1:
    name: JOB1
    runs-on: ubuntu-latest
    
    steps:
      
      - name: Step-1 - commands
        run: |
          pwd
          ls -ltr
          hostname
      
      - name: Step-2 - Checkout
        uses: actions/checkout@v6.1.0
    
      - name: Step-3 - create a file
        run: |
          echo 'pwd' >> myartifact.txt
          mkdir artifacts
          echo 'ls -ltr' >> artifacts/list.txt
          echo 'hostname' >> artifacts/hostname.txt
      - name: Step-4 - upload a singke file
        uses: actions/upload-artifact@v7.0.1
        with:
          name: single_file
          path: ./myartifact.txt

  job2:
    name: JOB2
    needs: job1
    runs-on: ubuntu-latest
    steps:
      - name: Download single file artifact
        uses: actions/download-artifact@v7
        with: 
          name: single_file

      - name: Referring Env vars
        run: |
          echo "[INFO] Runnin Deployment for $ENV_TYPE with user $APP_USER."
          echo "[INFO] Once deployed app is accessible on port $APP_PORT."

      - name: Referring Repo secrets
        run: |
          echo "[INFO] app password is ${{ secrets.ADD_TOOL_PASSW }}"

  job3:
    name: JOB3
    runs-on: ubuntu-latest
    steps:
      - name: Reffering context or in-built vars
        run: |
          echo "[INFO] Triggered by ${{ github.event_name }}."
          echo "[INFO] New changes are added by ${{ github.actor }} in ${{ github.ref_name }} branch."
          echo "[INFO] Current step is running on ${{ runner.os }}."
          echo "[INFO] Current job ID is ${{ job.check_run_id }}."
    
  staging: # new job4       
    name: STAGE DEPLOYMENT
    
    # Only run this job when a commit is pushed/merged to the 'dev' branch
    #if: github.ref_name == 'dev' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Referring env vars
        run: echo "[INFO] Running deployment on  ${{ vars.HOST }} using ${{ vars.USER }}."
      - name: Referrring env secrets
        run: echo "[INFO] Password for ${{ vars.USER }} is ${{ secrets.APP_SECRET_NAME }}."
    environment:
      name: STAGING

  production: # new job5      
    name: PROD DEPLOYMENT
    # Only deploys to PRODUCTION when code is actually pushed/merged into the 'main' branch
    #if: github.ref_name == 'main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Referring env vars
        run: echo "[INFO] Running deployment on  ${{ vars.HOST }} using ${{ vars.USER }}."
      - name: Referrring env secrets
        run: echo "[INFO] Password for ${{ vars.USER }} is ${{ secrets.APP_SECRET_NAME_PROD }}."
    environment:
      name: PRODUCTION

      
