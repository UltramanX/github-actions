name: workflow-syntax
on:
  push:
    branches: 
      - main
  pull_request:
    branches:
      - main

env:
  ENV_TYPE: DEV
  APP_USER: UltramanX
  APP_PORT: 80
  
jobs:
  job1:
    name: JOB1
    runs-on: ubuntu-latest
    
    steps:
      
      - name: Step-1 - commands
        run: |
          pwd
          ls -ltr
          hostname
      
      - name: Step-2 - Checkout
        uses: actions/checkout@v6.1.0
    
      - name: Step-3 - create a file
        run: |
          echo 'pwd' >> myartifact.txt
          mkdir artifacts
          echo 'ls -ltr' >> artifacts/list.txt
          echo 'hostname' >> artifacts/hostname.txt
      - name: Step-4 - upload a singke file
        uses: actions/upload-artifact@v7.0.1
        with:
          name: single_file
          path: ./myartifact.txt

  job2:
    name: JOB2
    needs: job1
    runs-on: ubuntu-latest
    steps:
      - name: Download single file artifact
        uses: actions/download-artifact@v7
        with: 
          name: single_file

      - name: Referring Env vars
        run: |
          echo "[INFO] Runnin Deployment for $ENV_TYPE with user $APP_USER."
          echo "[INFO] Once deployed app is accessible on port $APP_PORT."

      - name: Referring Repo secrets
        run: |
          echo "[INFO] app password is ${{ secrets.ADD_TOOL_PASSW }}"
          
