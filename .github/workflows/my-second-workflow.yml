name: my-second-workflow
on:
  push:

jobs:
  job1:
    name: My first job
    runs-on: ubuntu-latest
    
    steps:
      
      - name: Step-1 - commands
        run: |
          pwd
          ls -ltr
          hostname
      
      - name: Step-2 - Checkout
        uses: actions/checkout@v6.1.0
    
      - name: Step-3 - create a file
        run: |
          echo 'pwd' >> myartifact.txt
          ls -ltr
          hostname

      - name: Step-4 - upload a file
        uses: actions/upload-artifact@v7.0.1
        with:
    # Artifact name. If the `archive` input is `false`, the name of the file uploaded will be the artifact name.
          name: sing_file
    # A file, directory or wildcard pattern that describes what to upload.
          path: ./myartifact.txt
      
